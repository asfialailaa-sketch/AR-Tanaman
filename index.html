<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Pembelajaran Tanaman Tomat</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#000}
#scanHelp{position:fixed;z-index:20;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.68);color:#fff;padding:10px 17px;border-radius:22px;font-size:13px;text-align:center;width:max-content;max-width:90%}
#infoPanel{display:none;position:fixed;z-index:100;left:4%;right:4%;bottom:18px;max-height:43vh;overflow-y:auto;background:rgba(20,20,20,.95);color:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#infoTitle{margin:0 42px 10px 0;color:#8df2a4;font-size:25px} #infoText{margin:0;font-size:16px;line-height:1.55}
#closeInfo{position:absolute;right:12px;top:7px;border:none;background:transparent;color:#fff;font-size:30px;cursor:pointer;padding:5px 10px}
@media(min-width:800px){#infoPanel{left:auto;right:24px;bottom:24px;width:360px;max-height:55vh}}
</style>
</head>
<body>
<div id="scanHelp">Arahkan kamera ke gambar target tanaman tomat</div>
<div id="infoPanel"><button id="closeInfo">×</button><h2 id="infoTitle">Bagian Tanaman</h2><p id="infoText"></p></div>

<a-scene
  mindar-image="imageTargetSrc: ./assets/targets.mind; uiScanning: yes; uiLoading: yes;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: false"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets>
    <a-asset-item id="tomatoModel" src="./assets/tanaman-tomat.glb"></a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable; far: 100">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-light type="ambient" intensity="2.5"></a-light>
    <a-light type="directional" position="1 3 2" intensity="2"></a-light>
    <a-light type="directional" position="-2 1 1" intensity="1.5"></a-light>

    <a-gltf-model id="plantModel" src="#tomatoModel" position="0 -0.55 0.15" rotation="0 0 0" scale="0.55 0.55 0.55"></a-gltf-model>

    <!-- BUNGA -->
    <a-entity id="labelBunga" position="0.95 1.25 0.25">
      <a-entity line="start: 0.42 1.00 0.20; end: 0.82 1.15 0.20; color: #ffffff"></a-entity>
      <a-plane class="clickable" width="0.75" height="0.28" material="color:#087a45; opacity:.96; shader:flat">
        <a-text value="BUNGA" align="center" color="white" width="1.8" position="0 0 0.02"></a-text>
      </a-plane>
    </a-entity>

    <!-- DAUN -->
    <a-entity id="labelDaun" position="-1.05 0.65 0.25">
      <a-entity line="start: -0.48 0.62 0.20; end: -0.75 0.68 0.20; color: #ffffff"></a-entity>
      <a-plane class="clickable" width="0.75" height="0.28" material="color:#087a45; opacity:.96; shader:flat">
        <a-text value="DAUN" align="center" color="white" width="1.8" position="0 0 0.02"></a-text>
      </a-plane>
    </a-entity>

    <!-- BUAH -->
    <a-entity id="labelBuah" position="1.05 0.45 0.25">
      <a-entity line="start: 0.42 0.45 0.20; end: 0.82 0.47 0.20; color: #ffffff"></a-entity>
      <a-plane class="clickable" width="0.75" height="0.28" material="color:#087a45; opacity:.96; shader:flat">
        <a-text value="BUAH" align="center" color="white" width="1.8" position="0 0 0.02"></a-text>
      </a-plane>
    </a-entity>

    <!-- BATANG -->
    <a-entity id="labelBatang" position="1.02 -0.05 0.25">
      <a-entity line="start: 0.15 -0.12 0.20; end: 0.78 -0.08 0.20; color: #ffffff"></a-entity>
      <a-plane class="clickable" width="0.85" height="0.28" material="color:#087a45; opacity:.96; shader:flat">
        <a-text value="BATANG" align="center" color="white" width="1.8" position="0 0 0.02"></a-text>
      </a-plane>
    </a-entity>

    <!-- AKAR -->
    <a-entity id="labelAkar" position="-1.02 -0.85 0.25">
      <a-entity line="start: -0.18 -0.67 0.20; end: -0.70 -0.76 0.20; color: #ffffff"></a-entity>
      <a-plane class="clickable" width="0.75" height="0.28" material="color:#087a45; opacity:.96; shader:flat">
        <a-text value="AKAR" align="center" color="white" width="1.8" position="0 0 0.02"></a-text>
      </a-plane>
    </a-entity>

  </a-entity>
</a-scene>

<script>
const info={
  labelAkar:{title:"Akar",text:"Akar berfungsi menyerap air dan mineral dari tanah serta membantu menambatkan tanaman."},
  labelBatang:{title:"Batang",text:"Batang menopang tubuh tanaman dan menjadi jalur pengangkutan air serta zat hasil fotosintesis."},
  labelDaun:{title:"Daun",text:"Daun merupakan tempat utama fotosintesis, yaitu proses pembentukan makanan dengan memanfaatkan cahaya matahari."},
  labelBunga:{title:"Bunga",text:"Bunga merupakan organ reproduksi tanaman. Pada tanaman tomat, bunga berkembang menjadi buah setelah terjadi penyerbukan dan pembuahan."},
  labelBuah:{title:"Buah",text:"Buah tomat merupakan hasil perkembangan bunga dan di dalamnya terdapat biji sebagai bagian dari proses perkembangbiakan."}
};

function openInfo(id){
  const item=info[id];
  if(!item)return;
  document.getElementById("infoTitle").textContent=item.title;
  document.getElementById("infoText").textContent=item.text;
  document.getElementById("infoPanel").style.display="block";
}

document.getElementById("closeInfo").addEventListener("click",()=>{
  document.getElementById("infoPanel").style.display="none";
});

Object.keys(info).forEach(id=>{
  const parent=document.getElementById(id);
  if(!parent)return;
  const button=parent.querySelector(".clickable");
  if(!button)return;

  button.addEventListener("click",event=>{
    event.stopPropagation();
    openInfo(id);
  });

  button.addEventListener("touchend",event=>{
    event.preventDefault();
    event.stopPropagation();
    openInfo(id);
  },{passive:false});
});

const target=document.querySelector("[mindar-image-target]");
target.addEventListener("targetFound",()=>{
  document.getElementById("scanHelp").style.display="none";
});
target.addEventListener("targetLost",()=>{
  document.getElementById("scanHelp").style.display="block";
});
</script>
</body>
</html>
